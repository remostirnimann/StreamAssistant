# Tooling only: the integration itself is configured by custom_components/stream_assistant/manifest.json

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=custom_components.stream_assistant --cov-report=term-missing:skip-covered --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["custom_components/stream_assistant"]

[tool.coverage.report]
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = [".venv", "bridge", "dist"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "B",             # bugbear
    "UP",            # newer syntax
    "SIM",           # simplifications
    "RUF",           # ruff specific
    "ASYNC",         # asyncio pitfalls
    "PT",            # pytest style
    "LOG", "G",      # logging
]
ignore = [
    "E501",    # long lines are left to the formatter
    "RUF001",  # "×" and other non-ASCII characters are intended (German texts, grid names)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
