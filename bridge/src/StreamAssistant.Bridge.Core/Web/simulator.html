<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge Simulator</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --card: #fff; --text: #1d2125; --muted: #5f6b76; --line: #dde2e7; --accent: #0b7bd6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15181b; --card: #1e2226; --text: #e8eaed; --muted: #9aa4ad; --line: #30363c; --accent: #4aa8ff; } }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .head strong { flex: 1; }
  button.plug { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  .deck { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 8px; padding: 14px; background: #0c0c0c; border-radius: 14px; transition: filter .3s; }
  .deck.off { opacity: .35; }
  .deck.flash { outline: 4px solid var(--accent); }
  .key { aspect-ratio: 1; border-radius: 12%; background: #1b1b1b; border: 0; padding: 0; overflow: hidden; cursor: pointer; touch-action: manipulation; user-select: none; }
  .key img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .key.down { transform: scale(.94); }
  .strip { grid-column: 1 / -1; position: relative; background: #1b1b1b; border-radius: 8px; overflow: hidden; cursor: pointer; touch-action: none; user-select: none; }
  .strip img { position: absolute; display: block; pointer-events: none; }
  .dials { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(var(--dials), minmax(0, 1fr)); gap: 8px; }
  .dial { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .dial button { font: inherit; border: 0; color: #ddd; background: #262626; cursor: pointer; user-select: none; touch-action: manipulation; }
  .dial .turn { width: 34px; height: 34px; border-radius: 50%; }
  .dial .knob { width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #555, #222); }
  .dial .knob.down { transform: scale(.92); }
  .extras { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .extras .page { width: 22%; height: 18px; border: 0; border-radius: 6px; background: #262626; cursor: pointer; }
  .extras .page.down { transform: scale(.94); }
  .extras .screen { flex: 1; max-width: 50%; background: #1b1b1b; border-radius: 6px; overflow: hidden; }
  .extras .screen img { width: 100%; height: 100%; display: block; }
  .nfc { display: flex; gap: 8px; margin-top: 10px; }
  .nfc input { flex: 1; font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>Simulator</h1>
  <div class="muted">Simulated decks of this bridge. Click a key to press it, hold it for a long press. Dials: the arrows or the mouse wheel turn, the knob pushes. Touch strip: click, hold or drag. Lit page buttons (Neo) click like keys; a tag id can be "read" by the NFC reader (Studio). <span id="state"></span></div>
  <div id="decks"></div>
</main>
<script>
  const decks = new Map();
  let socket;

  function connect() {
    // Relative, so it also works under Home Assistant's ingress path (https there)
    const url = new URL("sim/ws", location.href);
    url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
    socket = new WebSocket(url);
    socket.onopen = () => (document.getElementById("state").textContent = "");
    socket.onclose = () => {
      document.getElementById("state").textContent = "(bridge not reachable, retrying …)";
      setTimeout(connect, 2000);
    };
    socket.onmessage = (ev) => handle(JSON.parse(ev.data));
  }

  function send(message) {
    if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
  }

  function handle(m) {
    if (m.type === "state") {
      decks.clear();
      document.getElementById("decks").replaceChildren();
      m.devices.forEach(renderDevice);
    } else if (m.type === "device") renderDevice(m);
    else if (m.type === "key") setKey(m.device, m.key, m.content);
    else if (m.type === "touch") addTouchImage(m.device, m.image);
    else if (m.type === "identify") {
      const el = decks.get(m.device)?.querySelector(".deck");
      el?.classList.add("flash");
      setTimeout(() => el?.classList.remove("flash"), 2000);
    }
  }

  function renderDevice(d) {
    let card = decks.get(d.id);
    if (!card) {
      card = document.createElement("section");
      card.className = "card";
      document.getElementById("decks").append(card);
      decks.set(d.id, card);
    }
    card.innerHTML = `<div class="head"><strong></strong><span class="muted"></span><button class="plug"></button></div>
      <div class="deck" style="--cols:${d.cols}"></div>`;
    card.querySelector("strong").textContent = d.name;
    card.querySelector(".muted").textContent = `${d.id} · ${d.cols} × ${d.rows}${d.dials ? ` + ${d.dials} dials` : ""} · ${d.plugged ? `brightness ${d.brightness} %` : "unplugged"}`;
    const plug = card.querySelector(".plug");
    plug.textContent = d.plugged ? "Unplug" : "Plug in";
    plug.onclick = () => send({ type: "plug", device: d.id, plugged: !d.plugged });
    const deck = card.querySelector(".deck");
    deck.classList.toggle("off", !d.plugged);
    deck.style.filter = `brightness(${Math.max(d.brightness, 5) / 100})`;
    for (let i = 0; i < d.cols * d.rows; i += 1) {
      const key = document.createElement("button");
      key.className = "key";
      key.dataset.key = i;
      key.innerHTML = "<img alt=''>";
      const up = () => {
        if (!key.classList.contains("down")) return;
        key.classList.remove("down");
        send({ type: "press", device: d.id, key: i, pressed: false });
      };
      key.onpointerdown = (ev) => {
        ev.preventDefault();
        key.setPointerCapture(ev.pointerId);
        key.classList.add("down");
        send({ type: "press", device: d.id, key: i, pressed: true });
      };
      key.onpointerup = up;
      key.onpointercancel = up;
      key.oncontextmenu = (ev) => ev.preventDefault();
      deck.append(key);
      setKey(d.id, i, d.keys[i]);
    }
    if (d.touch) renderStrip(deck, d);
    if (d.dials) renderDials(deck, d);
    if (d.buttons.length || d.screen) renderExtras(deck, d);
    if (d.nfc) renderNfc(card, d);
  }

  // Page buttons (lit in their colour) and the small screen between them (Neo)
  function renderExtras(deck, d) {
    const row = document.createElement("div");
    row.className = "extras";
    const button = (index) => {
      const el = document.createElement("button");
      el.className = "page";
      el.setAttribute("aria-label", `Button ${index + 1}`);
      el.style.background = d.buttons[index] && d.buttons[index] !== "#000000" ? d.buttons[index] : "";
      const up = () => {
        if (!el.classList.contains("down")) return;
        el.classList.remove("down");
        send({ type: "button", device: d.id, button: index, pressed: false });
      };
      el.onpointerdown = (ev) => {
        ev.preventDefault();
        el.setPointerCapture(ev.pointerId);
        el.classList.add("down");
        send({ type: "button", device: d.id, button: index, pressed: true });
      };
      el.onpointerup = up;
      el.onpointercancel = up;
      return el;
    };
    if (d.buttons.length) row.append(button(0));
    if (d.screen) {
      const screen = document.createElement("div");
      screen.className = "screen";
      screen.style.aspectRatio = `${d.screen.width} / ${d.screen.height}`;
      if (d.screen.src) screen.innerHTML = `<img alt="" src="${d.screen.src}">`;
      row.append(screen);
    }
    for (let i = 1; i < d.buttons.length; i += 1) row.append(button(i));
    deck.append(row);
  }

  function renderNfc(card, d) {
    const form = document.createElement("form");
    form.className = "nfc";
    form.innerHTML = `<input placeholder="NFC tag id, e.g. 04A2B3C4D5" aria-label="NFC tag id"><button class="plug">Read tag</button>`;
    form.onsubmit = (ev) => {
      ev.preventDefault();
      const id = form.querySelector("input").value.trim();
      if (id) send({ type: "nfc", device: d.id, id });
    };
    card.append(form);
  }

  // Touch strip: tap, long press (held 0.5 s) or swipe (dragged), in display pixels
  function renderStrip(deck, d) {
    const strip = document.createElement("div");
    strip.className = "strip";
    strip.dataset.width = d.touch.width;
    strip.dataset.height = d.touch.height;
    strip.style.aspectRatio = `${d.touch.width} / ${d.touch.height}`;
    deck.append(strip);
    d.touch.images.forEach((image) => addTouchImage(d.id, image));
    let start = null;
    const point = (ev) => {
      const box = strip.getBoundingClientRect();
      return [Math.round(((ev.clientX - box.left) / box.width) * d.touch.width), Math.round(((ev.clientY - box.top) / box.height) * d.touch.height)];
    };
    strip.onpointerdown = (ev) => {
      ev.preventDefault();
      strip.setPointerCapture(ev.pointerId);
      start = { at: Date.now(), xy: point(ev) };
    };
    strip.onpointerup = (ev) => {
      if (!start) return;
      const [x, y] = start.xy;
      const [x2, y2] = point(ev);
      if (Math.hypot(x2 - x, y2 - y) > d.touch.height / 3) send({ type: "touch", device: d.id, kind: "swipe", x, y, x2, y2 });
      else send({ type: "touch", device: d.id, kind: Date.now() - start.at >= 500 ? "long" : "tap", x, y });
      start = null;
    };
    strip.onpointercancel = () => (start = null);
    strip.oncontextmenu = (ev) => ev.preventDefault();
  }

  function addTouchImage(device, image) {
    const strip = decks.get(device)?.querySelector(".strip");
    if (!strip) return;
    const width = Number(strip.dataset.width);
    const height = Number(strip.dataset.height);
    const img = document.createElement("img");
    img.src = image.src;
    Object.assign(img.style, {
      left: `${(image.x / width) * 100}%`,
      top: `${(image.y / height) * 100}%`,
      width: `${(image.width / width) * 100}%`,
      height: `${(image.height / height) * 100}%`,
    });
    strip.append(img);
    // Fully covered images are gone; keep the page from piling them up
    for (const old of [...strip.querySelectorAll("img")].slice(0, -1)) {
      if (old.style.left === img.style.left && old.style.top === img.style.top && old.style.width === img.style.width && old.style.height === img.style.height) old.remove();
    }
  }

  function renderDials(deck, d) {
    const row = document.createElement("div");
    row.className = "dials";
    row.style.setProperty("--dials", d.dials);
    for (let i = 0; i < d.dials; i += 1) {
      const dial = document.createElement("div");
      dial.className = "dial";
      dial.innerHTML = `<button class="turn" aria-label="Turn left">⟲</button><button class="knob" aria-label="Push dial ${i + 1}"></button><button class="turn" aria-label="Turn right">⟳</button>`;
      const [left, knob, right] = dial.querySelectorAll("button");
      // LED ring (Studio): the lit share in its colour around the knob
      const leds = d.dial_leds?.[i];
      if (leds) {
        knob.style.boxShadow = "0 0 0 4px #111";
        knob.style.background = `radial-gradient(circle, ${leds.color} 0 22%, #333 23% 62%, transparent 63%), conic-gradient(${leds.color} 0 ${leds.level * 360}deg, #222 ${leds.level * 360}deg)`;
      }
      left.onclick = () => send({ type: "turn", device: d.id, dial: i, delta: -1 });
      right.onclick = () => send({ type: "turn", device: d.id, dial: i, delta: 1 });
      dial.onwheel = (ev) => {
        ev.preventDefault();
        send({ type: "turn", device: d.id, dial: i, delta: ev.deltaY > 0 ? 1 : -1 });
      };
      const up = () => {
        if (!knob.classList.contains("down")) return;
        knob.classList.remove("down");
        send({ type: "dial_press", device: d.id, dial: i, pressed: false });
      };
      knob.onpointerdown = (ev) => {
        ev.preventDefault();
        knob.setPointerCapture(ev.pointerId);
        knob.classList.add("down");
        send({ type: "dial_press", device: d.id, dial: i, pressed: true });
      };
      knob.onpointerup = up;
      knob.onpointercancel = up;
      knob.oncontextmenu = (ev) => ev.preventDefault();
      row.append(dial);
    }
    deck.append(row);
  }

  function setKey(device, index, content) {
    const key = decks.get(device)?.querySelector(`.key[data-key="${index}"]`);
    if (!key) return;
    const img = key.querySelector("img");
    if (content?.image) {
      img.src = content.image;
      img.hidden = false;
      key.style.background = "";
    } else {
      img.removeAttribute("src");
      img.hidden = true;
      key.style.background = content?.color || "";
    }
  }

  connect();
</script>
</body>
</html>
