# Checks every pull request and every push to develop and main.
# The job names are required status checks in the branch ruleset.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install Python packages
        run: pip install Pillow aiohttp
      - name: Compile
        run: python -m py_compile custom_components/stream_assistant/*.py custom_components/stream_assistant/protocol/*.py scripts/*.py
      - name: Check frontend scripts
        run: |
          node --check custom_components/stream_assistant/frontend/panel.js
          node --check custom_components/stream_assistant/frontend/card.js
      - name: Self test against a simulated Network Dock
        run: python scripts/selftest_transport.py
      - name: Self test against the bridge
        run: |
          dotnet build bridge/src/StreamAssistant.Bridge
          python scripts/selftest_bridge.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: Tests with coverage (minimum 90 %, see pyproject.toml)
        run: pytest --timeout=120

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements_test.txt)"
      - name: Lint
        run: ruff check --output-format github .
      - name: Format
        run: ruff format --check .

  bridge:
    name: Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Format
        run: dotnet format bridge --verify-no-changes
      - name: Tests with coverage
        # bridge/global.json (Microsoft.Testing.Platform) only applies inside bridge/
        working-directory: bridge
        run: dotnet test --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
      - name: Coverage (minimum 90 %)
        run: python scripts/check_coverage.py --min 90 --exclude /tests/ --exclude /obj/ bridge/tests/*/bin/Debug/net10.0/TestResults/coverage.cobertura.xml

  installers:
    name: Installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install script
        shell: bash
        run: |
          pip install shellcheck-py
          shellcheck -s sh bridge/install.sh
      - name: Windows installer
        shell: bash
        run: |
          dotnet publish bridge/src/StreamAssistant.Bridge -c Release -r win-x64 -o publish -p:DebugType=none
          cp LICENSE publish/
          dotnet build bridge/installer -c Release -p:BridgeDir="$PWD/publish/" -p:ProductVersion=0.0.1 -o msi

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The logo in home-assistant/brands comes with the move to the default HACS list
          ignore: brands

  release-check:
    name: Release check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version and changelog
        id: info
        # Only a pull request into main must be releasable; elsewhere this is informational
        continue-on-error: ${{ github.base_ref != 'main' }}
        run: python scripts/release_info.py >> "$GITHUB_OUTPUT"
      - name: The tag must not exist yet
        if: github.base_ref == 'main'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.info.outputs.tag }}" > /dev/null; then
            echo "::error::Tag ${{ steps.info.outputs.tag }} exists already, raise the version"
            exit 1
          fi
